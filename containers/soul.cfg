% Qollab: under XeTeX, soul typesets letter by letter and drops Hangul unless
% xeCJK handles it, so [text]{.underline} and ~~text~~ lost Korean words with
% the default fonts. ulem boxes whole words instead: lines still break at
% spaces and the rule takes the current text color. soul reads this file in
% its option section, where packages cannot be loaded yet.
\ifdefined\XeTeXrevision
  \AtEndOfPackage{%
    \RequirePackage[normalem]{ulem}%
    \let\ul\uline
    \let\st\sout}
\fi
